<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Mi Chat</title>

    <script src="/socket.io/socket.io.js"></script>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            height: 100vh;
            overflow: hidden;
            background: #f0f2f5;
        }

        button,
        input {
            font: inherit;
        }

        /* LOGIN */

        #authScreen {
            position: fixed;
            inset: 0;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 20px;

            background:
                linear-gradient(
                    135deg,
                    #128c7e,
                    #075e54
                );
        }

        .authBox {

            width: 100%;
            max-width: 400px;

            padding: 30px;

            background: white;

            border-radius: 20px;

            text-align: center;

            box-shadow:
                0 15px 40px
                rgba(0,0,0,.25);
        }

        .authInput {

            width: 100%;

            padding: 14px;

            margin: 7px 0;

            border:
                1px solid #ddd;

            border-radius: 10px;

            outline: none;
        }

        .authButton {

            width: 100%;

            padding: 14px;

            margin-top: 10px;

            border: 0;

            border-radius: 10px;

            background: #128c7e;

            color: white;

            font-weight: bold;

            cursor: pointer;
        }

        .switchButton {

            border: 0;

            background: transparent;

            color: #075e54;

            cursor: pointer;

            margin-top: 15px;
        }

        #authError {

            min-height: 22px;

            margin-top: 10px;

            color: #d00000;
        }

        /* APP */

        #app {
            display: none;
            height: 100vh;
        }

        .layout {

            display: flex;

            height: 100%;

            max-width: 1400px;

            margin: auto;

            background: white;
        }

        /* SIDEBAR */

        .sidebar {

            width: 320px;

            border-right:
                1px solid #ddd;

            display: flex;

            flex-direction: column;
        }

        .sidebarHeader {

            padding: 15px;

            background: #075e54;

            color: white;
        }

        .headerTop {

            display: flex;

            align-items: center;

            justify-content: space-between;
        }

        .headerTop h2 {
            margin: 0;
        }

        .logoutButton {

            padding: 7px 10px;

            border: 0;

            border-radius: 8px;

            background:
                rgba(255,255,255,.15);

            color: white;

            cursor: pointer;
        }

        .onlineCount {

            margin-top: 5px;

            font-size: 13px;

            opacity: .85;
        }

        .search {

            padding: 10px;

            border-bottom:
                1px solid #ddd;
        }

        .search input {

            width: 100%;

            padding: 12px 14px;

            border: 0;

            outline: none;

            border-radius: 20px;

            background: #f0f2f5;
        }

        #users {

            flex: 1;

            overflow-y: auto;
        }

        .user {

            display: flex;

            align-items: center;

            gap: 12px;

            padding: 13px;

            cursor: pointer;

            border-bottom:
                1px solid #eee;
        }

        .user:hover {
            background: #f5f5f5;
        }

        .avatar {

            width: 45px;

            height: 45px;

            flex-shrink: 0;

            display: flex;

            align-items: center;

            justify-content: center;

            border-radius: 50%;

            background: #128c7e;

            color: white;

            font-weight: bold;

            font-size: 18px;
        }

        .userInfo {
            flex: 1;
            min-width: 0;
        }

        .userName {
            font-weight: bold;
        }

        .statusRow {

            margin-top: 4px;

            display: flex;

            align-items: center;

            justify-content: space-between;
        }

        .statusOnline {

            color: #18a558;

            font-size: 12px;
        }

        .statusOffline {

            color: #999;

            font-size: 12px;
        }

        .badge {

            min-width: 21px;

            height: 21px;

            padding: 0 6px;

            display: flex;

            align-items: center;

            justify-content: center;

            border-radius: 20px;

            background: #25d366;

            color: white;

            font-size: 12px;

            font-weight: bold;
        }

        /* CHAT */

        .chat {

            flex: 1;

            min-width: 0;

            display: flex;

            flex-direction: column;
        }

        .chatHeader {

            height: 70px;

            padding: 12px 18px;

            border-bottom:
                1px solid #ddd;

            display: flex;

            align-items: center;

            gap: 12px;
        }

        .chatInfo {
            flex: 1;
        }

        .chatTitle {
            font-weight: bold;
        }

        .chatSubtitle {

            margin-top: 3px;

            font-size: 13px;

            color: #777;
        }

        .back {

            display: none;

            border: 0;

            background: transparent;

            font-size: 25px;

            cursor: pointer;
        }

        #messages {

            flex: 1;

            overflow-y: auto;

            padding: 20px;

            background: #e5ddd5;
        }

        .empty {

            height: 100%;

            display: flex;

            align-items: center;

            justify-content: center;

            text-align: center;

            color: #666;
        }

        .messageRow {

            display: flex;

            margin: 7px 0;
        }

        .mine {
            justify-content: flex-end;
        }

        .bubble {

            max-width: 75%;

            padding: 9px 12px;

            border-radius: 12px;

            background: white;

            box-shadow:
                0 1px 2px
                rgba(0,0,0,.15);

            word-break: break-word;
        }

        .mine .bubble {
            background: #d9fdd3;
        }

        .from {

            margin-bottom: 4px;

            color: #666;

            font-size: 11px;

            font-weight: bold;
        }

        .time {

            margin-top: 5px;

            color: #777;

            text-align: right;

            font-size: 10px;
        }

        .messageInput {

            display: flex;

            gap: 10px;

            padding: 10px;

            background: #f0f2f5;

            border-top:
                1px solid #ddd;
        }

        .messageInput input {

            flex: 1;

            border: 0;

            outline: none;

            border-radius: 25px;

            padding: 14px 18px;
        }

        .send {

            width: 50px;

            height: 50px;

            border: 0;

            border-radius: 50%;

            background: #128c7e;

            color: white;

            cursor: pointer;

            font-size: 20px;
        }

        /* NOTIFICACIONES */

        #notifications {

            position: fixed;

            top: 15px;

            right: 15px;

            z-index: 9999;

            width:
                min(350px, calc(100vw - 30px));
        }

        .notification {

            padding: 14px;

            margin-bottom: 10px;

            background: white;

            border-left:
                5px solid #25d366;

            border-radius: 14px;

            box-shadow:
                0 6px 25px
                rgba(0,0,0,.2);

            cursor: pointer;
        }

        .notificationTitle {
            font-weight: bold;
            margin-bottom: 5px;
        }

        .notificationText {
            color: #555;
            font-size: 14px;
        }

        /* MOVIL */

        @media (max-width: 700px) {

            .sidebar {
                width: 100%;
            }

            .chat {
                display: none;
            }

            .mobileChat .sidebar {
                display: none;
            }

            .mobileChat .chat {
                display: flex;
            }

            .back {
                display: block;
            }
        }

    </style>

</head>

<body>

<!-- ======================================
     LOGIN
======================================= -->

<div id="authScreen">

    <div class="authBox">

        <h1>💬 Mi Chat</h1>

        <div id="authDescription">
            Inicia sesión para entrar.
        </div>

        <input
            id="authUsername"
            class="authInput"
            type="text"
            placeholder="Nombre de usuario"
            maxlength="24"
            autocomplete="username"
        >

        <input
            id="authPassword"
            class="authInput"
            type="password"
            placeholder="Contraseña"
            autocomplete="current-password"
        >

        <button
            id="authButton"
            class="authButton"
        >
            Iniciar sesión
        </button>

        <button
            id="switchAuth"
            class="switchButton"
        >
            Crear una cuenta
        </button>

        <div id="authError"></div>

    </div>

</div>

<!-- ======================================
     APP
======================================= -->

<div id="app">

    <div
        id="layout"
        class="layout"
    >

        <aside class="sidebar">

            <div class="sidebarHeader">

                <div class="headerTop">

                    <h2>💬 Mi Chat</h2>

                    <button
                        id="logoutButton"
                        class="logoutButton"
                    >
                        Salir
                    </button>

                </div>

                <div class="onlineCount">

                    <span id="onlineCount">0</span>
                    en línea

                </div>

            </div>

            <div class="search">

                <input
                    id="searchInput"
                    placeholder="Buscar usuario..."
                >

            </div>

            <div id="users"></div>

        </aside>

        <main class="chat">

            <header class="chatHeader">

                <button
                    id="backButton"
                    class="back"
                >
                    ←
                </button>

                <div
                    id="headerAvatar"
                    class="avatar"
                >
                    ?
                </div>

                <div class="chatInfo">

                    <div
                        id="chatTitle"
                        class="chatTitle"
                    >
                        Selecciona un usuario
                    </div>

                    <div
                        id="chatSubtitle"
                        class="chatSubtitle"
                    >
                        Puedes hablar incluso si está desconectado
                    </div>

                </div>

            </header>

            <div id="messages">

                <div class="empty">

                    Selecciona un usuario para ver
                    la conversación.

                </div>

            </div>

            <div class="messageInput">

                <input
                    id="messageInput"
                    placeholder="Escribe un mensaje..."
                    autocomplete="off"
                    disabled
                >

                <button
                    id="sendButton"
                    class="send"
                    disabled
                >
                    ➤
                </button>

            </div>

        </main>

    </div>

</div>

<div id="notifications"></div>

<script>

const socket = io({
    autoConnect: false
});

let myUsername = "";

let selectedUser = "";

let allUsers = [];

let authMode = "login";

let conversations = {};

let unread = {};

// ==========================================
// ELEMENTOS
// ==========================================

const authScreen =
    document.getElementById("authScreen");

const app =
    document.getElementById("app");

const authUsername =
    document.getElementById("authUsername");

const authPassword =
    document.getElementById("authPassword");

const authButton =
    document.getElementById("authButton");

const switchAuth =
    document.getElementById("switchAuth");

const authDescription =
    document.getElementById("authDescription");

const authError =
    document.getElementById("authError");

const usersContainer =
    document.getElementById("users");

const searchInput =
    document.getElementById("searchInput");

const messagesContainer =
    document.getElementById("messages");

const messageInput =
    document.getElementById("messageInput");

const sendButton =
    document.getElementById("sendButton");

const chatTitle =
    document.getElementById("chatTitle");

const chatSubtitle =
    document.getElementById("chatSubtitle");

const headerAvatar =
    document.getElementById("headerAvatar");

const layout =
    document.getElementById("layout");

const notifications =
    document.getElementById("notifications");

// ==========================================
// CAMBIAR LOGIN / REGISTRO
// ==========================================

switchAuth.addEventListener(
    "click",
    () => {

        authError.textContent = "";

        if (authMode === "login") {

            authMode = "register";

            authDescription.textContent =
                "Crea una cuenta.";

            authButton.textContent =
                "Crear cuenta";

            switchAuth.textContent =
                "Ya tengo una cuenta";

        } else {

            authMode = "login";

            authDescription.textContent =
                "Inicia sesión para entrar.";

            authButton.textContent =
                "Iniciar sesión";

            switchAuth.textContent =
                "Crear una cuenta";
        }

    }
);

// ==========================================
// LOGIN / REGISTRO
// ==========================================

authButton.addEventListener(
    "click",
    authenticate
);

authPassword.addEventListener(
    "keydown",
    event => {

        if (event.key === "Enter") {
            authenticate();
        }

    }
);

async function authenticate() {

    const username =
        authUsername.value.trim();

    const password =
        authPassword.value;

    authError.textContent = "";

    if (!username || !password) {

        authError.textContent =
            "Completa todos los campos.";

        return;
    }

    authButton.disabled = true;

    try {

        const endpoint =
            authMode === "register"
                ? "/api/register"
                : "/api/login";

        const response =
            await fetch(
                endpoint,
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({
                        username,
                        password
                    })
                }
            );

        const data =
            await response.json();

        if (!response.ok) {

            authError.textContent =
                data.error ||
                "No se pudo completar.";

            authButton.disabled = false;

            return;
        }

        localStorage.setItem(
            "chatToken",
            data.token
        );

        myUsername =
            data.username;

        enterApp();

    } catch {

        authError.textContent =
            "No se pudo conectar con el servidor.";
    }

    authButton.disabled = false;
}

// ==========================================
// COMPROBAR SESIÓN
// ==========================================

async function checkSavedSession() {

    const token =
        localStorage.getItem(
            "chatToken"
        );

    if (!token) {
        return;
    }

    try {

        const response =
            await fetch(
                "/api/session",
                {
                    headers: {
                        Authorization:
                            "Bearer " + token
                    }
                }
            );

        if (!response.ok) {

            localStorage.removeItem(
                "chatToken"
            );

            return;
        }

        const data =
            await response.json();

        if (data.loggedIn) {

            myUsername =
                data.username;

            enterApp();
        }

    } catch {
        // Mostrar login.
    }
}

// ==========================================
// ENTRAR EN LA APP
// ==========================================

function enterApp() {

    authScreen.style.display =
        "none";

    app.style.display =
        "block";

    socket.connect();
}

// ==========================================
// AUTENTICACIÓN SOCKET
// ==========================================

socket.on(
    "connect",
    () => {

        const token =
            localStorage.getItem(
                "chatToken"
            );

        if (!token) {
            return;
        }

        socket.emit(
            "authenticate",
            token
        );
    }
);

socket.on(
    "authenticated",
    data => {

        myUsername =
            data.username;

    }
);

// ==========================================
// LISTA DE TODOS LOS USUARIOS
// ==========================================

socket.on(
    "userList",
    users => {

        allUsers = users;

        const onlineCount =
            users.filter(
                user => user.online
            ).length;

        document.getElementById(
            "onlineCount"
        ).textContent =
            onlineCount;

        renderUsers();
    }
);

function renderUsers() {

    const search =
        searchInput.value
            .toLowerCase()
            .trim();

    usersContainer.innerHTML = "";

    allUsers
        .filter(user => {

            if (
                user.username ===
                myUsername.toLowerCase()
            ) {
                return false;
            }

            return user.displayName
                .toLowerCase()
                .includes(search);

        })
        .forEach(user => {

            const element =
                document.createElement("div");

            element.className =
                "user";

            const count =
                unread[user.username] || 0;

            element.innerHTML = `

                <div class="avatar">
                    ${escapeHtml(
                        user.displayName
                            .charAt(0)
                            .toUpperCase()
                    )}
                </div>

                <div class="userInfo">

                    <div class="userName">
                        ${escapeHtml(
                            user.displayName
                        )}
                    </div>

                    <div class="statusRow">

                        ${
                            user.online
                            ?
                            `
                            <div class="statusOnline">
                                ● En línea
                            </div>
                            `
                            :
                            `
                            <div class="statusOffline">
                                ○ Desconectado
                            </div>
                            `
                        }

                        ${
                            count > 0
                            ?
                            `
                            <div class="badge">
                                ${
                                    count > 99
                                    ? "99+"
                                    : count
                                }
                            </div>
                            `
                            :
                            ""
                        }

                    </div>

                </div>
            `;

            element.addEventListener(
                "click",
                () => {

                    openChat(
                        user.username,
                        user.displayName,
                        user.online
                    );

                }
            );

            usersContainer.appendChild(
                element
            );
        });
}

searchInput.addEventListener(
    "input",
    renderUsers
);

// ==========================================
// ABRIR CHAT
// ==========================================

function openChat(
    username,
    displayName,
    online
) {

    selectedUser =
        username;

    unread[username] = 0;

    renderUsers();

    chatTitle.textContent =
        displayName;

    chatSubtitle.textContent =
        online
            ? "● En línea"
            : "○ Desconectado";

    headerAvatar.textContent =
        displayName
            .charAt(0)
            .toUpperCase();

    messageInput.disabled =
        false;

    sendButton.disabled =
        false;

    layout.classList.add(
        "mobileChat"
    );

    // Pedir TODO el historial
    socket.emit(
        "getConversation",
        username
    );

    // Marcar como leídos
    socket.emit(
        "markConversationRead",
        username
    );

    messageInput.focus();
}

// ==========================================
// HISTORIAL
// ==========================================

socket.on(
    "conversationHistory",
    data => {

        conversations[
            data.username
        ] =
            data.messages || [];

        if (
            selectedUser ===
            data.username
        ) {

            renderConversation(
                data.username
            );
        }

    }
);

function renderConversation(
    username
) {

    const list =
        conversations[
            username
        ] || [];

    messagesContainer.innerHTML = "";

    if (!list.length) {

        messagesContainer.innerHTML = `

            <div class="empty">

                Todavía no hay mensajes
                con este usuario.

            </div>

        `;

        return;
    }

    list.forEach(
        addMessageToScreen
    );

    scrollBottom();
}

function addMessageToScreen(
    data
) {

    const empty =
        messagesContainer.querySelector(
            ".empty"
        );

    if (empty) {
        empty.remove();
    }

    const mine =
        data.from === myUsername;

    const row =
        document.createElement("div");

    row.className =
        "messageRow " +
        (mine ? "mine" : "");

    const bubble =
        document.createElement("div");

    bubble.className =
        "bubble";

    const date =
        new Date(data.time);

    const time =
        date
            .getHours()
            .toString()
            .padStart(2, "0")
        +
        ":"
        +
        date
            .getMinutes()
            .toString()
            .padStart(2, "0");

    bubble.innerHTML = `

        ${
            mine
            ? ""
            :
            `
            <div class="from">
                ${escapeHtml(
                    data.from
                )}
            </div>
            `
        }

        <div>
            ${escapeHtml(
                data.message
            )}
        </div>

        <div class="time">
            ${time}
        </div>
    `;

    row.appendChild(
        bubble
    );

    messagesContainer.appendChild(
        row
    );
}

function scrollBottom() {

    messagesContainer.scrollTop =
        messagesContainer.scrollHeight;
}

// ==========================================
// CONTADORES
// ==========================================

socket.on(
    "unreadCounts",
    counts => {

        unread =
            counts || {};

        renderUsers();
    }
);

// ==========================================
// RECIBIR MENSAJE
// ==========================================

socket.on(
    "privateMessage",
    data => {

        const other =
            data.from === myUsername
                ? data.to
                : data.from;

        // Guardarlo en memoria de la página
        if (
            !conversations[other]
        ) {
            conversations[other] =
                [];
        }

        const exists =
            conversations[other]
                .some(
                    msg =>
                        msg.id ===
                        data.id
                );

        if (!exists) {

            conversations[other]
                .push(data);
        }

        // Si el chat está abierto
        if (
            selectedUser ===
            other
        ) {

            addMessageToScreen(
                data
            );

            scrollBottom();

            socket.emit(
                "markConversationRead",
                other
            );

        } else {

            unread[other] =
                (unread[other] || 0) + 1;

            renderUsers();

            showNotification(
                data.from,
                data.message,
                other
            );
        }
    }
);

// ==========================================
// MENSAJE ENVIADO
// ==========================================

socket.on(
    "messageSent",
    data => {

        const other =
            data.to;

        if (
            !conversations[other]
        ) {
            conversations[other] =
                [];
        }

        const exists =
            conversations[other]
                .some(
                    msg =>
                        msg.id ===
                        data.id
                );

        if (!exists) {

            conversations[other]
                .push(data);
        }

        if (
            selectedUser ===
            other
        ) {

            addMessageToScreen(
                data
            );

            scrollBottom();
        }
    }
);

// ==========================================
// ENVIAR MENSAJE
// ==========================================

sendButton.addEventListener(
    "click",
    sendMessage
);

messageInput.addEventListener(
    "keydown",
    event => {

        if (event.key === "Enter") {
            sendMessage();
        }

    }
);

function sendMessage() {

    const text =
        messageInput.value.trim();

    if (
        !text ||
        !selectedUser
    ) {
        return;
    }

    socket.emit(
        "privateMessage",
        {
            to:
                selectedUser,
            message:
                text
        }
    );

    messageInput.value = "";

    messageInput.focus();
}

// ==========================================
// NOTIFICACIONES
// ==========================================

function showNotification(
    from,
    text,
    username
) {

    const notification =
        document.createElement("div");

    notification.className =
        "notification";

    notification.innerHTML = `

        <div class="notificationTitle">
            💬 ${escapeHtml(from)}
        </div>

        <div class="notificationText">
            ${escapeHtml(text)}
        </div>
    `;

    notification.addEventListener(
        "click",
        () => {

            const user =
                allUsers.find(
                    item =>
                        item.username ===
                        username
                );

            if (user) {

                openChat(
                    user.username,
                    user.displayName,
                    user.online
                );
            }

            notification.remove();
        }
    );

    notifications.appendChild(
        notification
    );

    setTimeout(
        () => notification.remove(),
        6000
    );
}

// ==========================================
// LOGOUT
// ==========================================

document
    .getElementById("logoutButton")
    .addEventListener(
        "click",
        async () => {

            const token =
                localStorage.getItem(
                    "chatToken"
                );

            try {

                await fetch(
                    "/api/logout",
                    {
                        method: "POST",
                        headers: {
                            Authorization:
                                "Bearer " +
                                token
                        }
                    }
                );

            } catch {}

            localStorage.removeItem(
                "chatToken"
            );

            socket.disconnect();

            location.reload();
        }
    );

// ==========================================
// VOLVER EN MÓVIL
// ==========================================

document
    .getElementById("backButton")
    .addEventListener(
        "click",
        () => {

            layout.classList.remove(
                "mobileChat"
            );
        }
    );

// ==========================================
// SEGURIDAD HTML
// ==========================================

function escapeHtml(text) {

    const div =
        document.createElement("div");

    div.textContent =
        String(text);

    return div.innerHTML;
}

// ==========================================
// ARRANCAR
// ==========================================

checkSavedSession();

</script>
